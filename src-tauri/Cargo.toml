[package]
name = "sift"
version = "0.1.0"
description = "Automated PRISMA 2020 systematic reviews"
edition = "2021"
rust-version = "1.85"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "process"] }
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "http2"] }
jsonschema = { version = "0.57", default-features = false }
schemars = "1"
strsim = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
